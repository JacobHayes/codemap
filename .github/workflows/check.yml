# `mise run check` is the one gate; advisories run apart because they change without a commit.
name: check

on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      # Saved only from main, so a branch never evicts main's cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Save even when the check fails, so one red run doesn't leave the next one cold.
          cache-on-failure: true
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - run: mise run check
        env:
          # The runner context exists only at step level.
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-logs
          path: ${{ runner.temp }}/check-logs

  advisories:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: cargo deny check advisories
