# Releases (PRACTICES, Releases): dispatched by hand on main with the part to bump. The workflow
# picks the version (scripts/next-version), publishes only a commit whose check passed on main,
# builds the binary on each target with that version, and one job with write access creates the
# tag and the GitHub release. macOS builds only on the self-hosted runner `jrh-mini`, never on a
# GitHub-hosted macOS runner.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "The part of the highest vX.Y.Z tag to bump (the lower parts reset)"
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

# Every action is pinned by full commit SHA, its release in a comment: a tag can be moved.

# Two dispatches never overlap (each picks its version from the tags that exist), and one in
# flight is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Refuses before anything is built unless this is main, main's own check passed on this
  # commit, and the next version's tag is free. A missing run or a failed API call refuses too.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REF: ${{ github.ref }}
      SHA: ${{ github.sha }}
      BUMP: ${{ inputs.bump }}
      ATTEMPT: ${{ github.run_attempt }}
    steps:
      # A re-run would pick a new version from the tags that exist now, not the original one.
      - name: Refuse a re-run
        run: '[ "$ATTEMPT" = 1 ] || { echo "::error::dispatch the release again instead of re-running it"; exit 1; }'
      - name: Refuse a dispatch that is not on main
        run: '[ "$REF" = refs/heads/main ] || { echo "::error::releases are dispatched on main, not $REF"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse unless check passed on main at this commit
        run: |
          runs=$(gh run list -w check.yml -b main -e push -c "$SHA" --status completed \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length') \
            || { echo "::error::could not list check runs"; exit 1; }
          [ "$runs" -gt 0 ] || { echo "::error::no successful check run on main at $SHA"; exit 1; }
      - name: Pick the next version, and refuse a tag that exists
        id: next
        run: |
          tags=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")') \
            || { echo "::error::could not list the tags"; exit 1; }
          tag=$(scripts/next-version "$BUMP" <<<"$tags")
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists"; exit 1
          fi
          echo "$BUMP bump: $tag"
          echo "version=$tag" >>"$GITHUB_OUTPUT"

  # Each leg builds natively: the web app first (the binary embeds it; `mise run` installs the
  # dependencies, DuckDB's prebuilt libraries for the leg's platform among them), then the binary.
  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: jrh-mini, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: mise run build:web
      - name: Build the binary
        # The version is the tag without its v; the binary reports it (`codemap --version`).
        run: CODEMAP_VERSION="${VERSION#v}" cargo build --release --locked -p codemap
      - name: Refuse a binary that reports another version
        run: '[ "$(target/release/codemap --version)" = "codemap ${VERSION#v}" ]'
      - run: scripts/package "$VERSION" "${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error

  # The only job that can write: no checkout, no build, only the archives the legs made. It
  # creates the tag itself, at the commit that was verified and built, and only once every leg
  # has succeeded.
  release:
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          archives=(dist/release/codemap-"$TAG"-*.tar.gz)
          [ "${#archives[@]}" -eq 3 ] || { echo "::error::expected 3 archives, found ${#archives[@]}"; exit 1; }
          for archive in "${archives[@]}"; do
            [ -f "$archive.sha256" ] || { echo "::error::$archive has no .sha256"; exit 1; }
          done
          (cd dist/release && sha256sum -c codemap-*.sha256)
          gh release create "$TAG" --target "$SHA" --generate-notes dist/release/codemap-*
