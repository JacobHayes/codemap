[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/JacobHayes/codemap"
publish = false

[workspace.dependencies]
codemap-core = { path = "crates/core" }
codemap-lang = { path = "crates/lang" }
# Wire types for the query layer, and the JSON they travel as (also how findings keep their detail).
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
# Reads `.codemap/config.toml`: rules, acknowledgements and role overrides.
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
# Typed errors at module boundaries (PRACTICES, Code).
thiserror = { version = "2.0.21", default-features = false }
# Generates the TypeScript wire types from the Rust ones, so the UI cannot drift.
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"] }
# The CLI: derive-based argument parsing and --version.
clap = { version = "4.6.7", default-features = false, features = ["derive", "help", "std", "usage", "error-context"] }
# The HTTP server behind `codemap serve`: routing, JSON bodies, HTTP/1 on tokio.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
# The async runtime axum runs on.
tokio = { version = "1.54.1", default-features = false, features = ["macros", "net", "rt-multi-thread"] }
# Embeds the built web app in the binary (debug builds too, so the browser tests run the real thing).
rust-embed = { version = "8.13.0", default-features = false, features = ["debug-embed", "mime-guess"] }
# Drives the router in tests without a socket.
tower = { version = "0.5.3", default-features = false, features = ["util"] }
# Parses source into syntax trees; one parser for every language.
tree-sitter = { version = "0.27.1", default-features = false, features = ["std"] }
# The Rust grammar and its tags query.
tree-sitter-rust = "0.24.2"
# The Python grammar and its tags query.
tree-sitter-python = "0.25.0"
# The index store: embedded columnar SQL, so every view is a GROUP BY. Bundled so the binary is self-contained.
duckdb = { version = "~1.20000.1", default-features = false, features = ["bundled"] }
# Content hashes for hash-and-diff and the build id: fast on large trees.
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
# Walks the tree honouring .gitignore and similar files.
ignore = { version = "0.4.34", default-features = false }
# Extracts files in parallel; extraction is a pure function of path and bytes.
rayon = { version = "1.12.0", default-features = false }
# Token counts per line with the o200k encoding.
bpe-openai = { version = "0.3.2", default-features = false }
# Watches the served tree so `codemap serve` re-indexes what changes.
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
# Turns the change-notification channel into the stream behind server-sent events.
tokio-stream = { version = "0.1.19", default-features = false, features = ["sync"] }
# Throwaway trees for the indexing tests.
tempfile = { version = "3.27.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Errors return; a broken invariant is `expect("why this holds")` (PRACTICES, Code).
unwrap_used = "deny"
# Clippy's lint for functions over the line threshold in clippy.toml.
too_many_lines = "warn"
