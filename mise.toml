[tools]
node = "26.12.1"
# Dependencies a crate declares and never uses: a check step.
"github:bnjbvr/cargo-machete" = "0.9.2"
# RustSec advisories over Cargo.lock: CI only.
cargo-deny = "0.20.2"

[tasks.check]
description = "The one gate: fix, lint, test, build, browser-test"
run = "scripts/check"

[tasks.review]
description = "Independent review of the uncommitted change (the working-copy commit)"
# No sandbox: it gets in the way of the commands a reviewer runs and protects nothing here.
run = "codex exec review --uncommitted -m gpt-6.1-sol -c model_reasoning_effort=high --ephemeral --dangerously-bypass-approvals-and-sandbox"

[tasks.gen]
description = "Regenerate the TypeScript wire types from the Rust ones"
run = "scripts/check gen"

[tasks."build:web"]
description = "Build the web app into web/dist, which the binary embeds"
dir = "web"
run = "npm ci && npm run build"

[tasks.screenshots]
description = "Walk every view state at 1440 and 1024px in both themes into dist/screenshots/"
depends = ["build:web"]
run = '''
cargo build
rm -rf dist/screenshots
cd web && CODEMAP_SHOTS="$(cd .. && pwd)/dist/screenshots" npx playwright test e2e/walk.spec.ts
'''

[tasks.dev]
description = "Run the Vite dev server (proxies /api to `codemap serve`)"
dir = "web"
run = "npm run dev"
